[project]
name = "lhm"
version = "0.1.0"
description = "Linux hardening and management CLI for Debian/Ubuntu"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
lhm = "lhm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lhm"]

[tool.hatch.build.targets.wheel.force-include]
templates = "lhm/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
